name: Nightly update check

# Publishes a new image only when the packages inside it would change
# (the method linuxserver.io uses). Every night at 04:00 US Eastern:
#   1. Build the image with today's Ubuntu updates (APT_REFRESH) and, once a
#      month, fresh Python packages (PY_REFRESH), reusing the build cache.
#      Nothing is pushed in this step.
#   2. List every package in it (dpkg and pip) and compare the list with
#      package_versions.txt.
#   3. If it changed: commit the new list (the diff shows exactly what
#      changed), then run build-image.yml, which builds, scans with Trivy and
#      publishes :dev. If not: publish nothing, so Unraid shows no update.
#
# GitHub disables scheduled workflows after 60 days without repository
# activity. When nothing changed, the "# Checked:" line in
# package_versions.txt is still updated once a month, and that commit counts
# as activity.
#
# Commits made with GITHUB_TOKEN do not trigger other workflows, so this
# workflow calls build-image.yml itself instead of relying on the push.
#
# All third-party Actions are pinned to immutable full commit SHAs.
# See ci.yml header for the rationale (GHSA-69fq-xp46-6x23 / CVE-2026-33634).

on:
  schedule:
    - cron: "0 4 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-updates
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aegisnir/sd-webui-forge-neo-unraid

jobs:
  check:
    name: Build and compare package list
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      packages: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}

    steps:
      - name: Free runner disk space
        # Same cleanup as build-image.yml; the image is also loaded locally.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Checkout dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
        with:
          ref: dev

      - name: Work out refresh values
        id: meta
        run: |
          # Keep these two in step with build-image.yml.
          {
            echo "apt_refresh=$(TZ=America/New_York date +%F)"
            echo "py_refresh=$(TZ=America/New_York date +%Y-%m)"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR (read the build cache)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: update-check:local
          build-args: |
            APT_REFRESH=${{ steps.meta.outputs.apt_refresh }}
            PY_REFRESH=${{ steps.meta.outputs.py_refresh }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      - name: List packages
        run: |
          docker run --rm --entrypoint /bin/bash update-check:local -c \
            'dpkg-query -W -f="\${Package}=\${Version}\n" | sort; echo "# python"; python3 -m pip list --format=freeze | sort' \
            > /tmp/packages.txt
          test -s /tmp/packages.txt
          grep -q '^torch==' /tmp/packages.txt

      - name: Compare and commit
        id: compare
        run: |
          month="$(TZ=America/New_York date +%Y-%m)"
          old_body="$(grep -v '^# Checked:' package_versions.txt 2>/dev/null || true)"
          new_body="$(cat /tmp/packages.txt)"
          old_month="$(sed -n 's/^# Checked: //p' package_versions.txt 2>/dev/null || true)"
          if [[ "${old_body}" != "${new_body}" ]]; then
            changed=true
            message="chore: package updates ($(TZ=America/New_York date +%F))"
          elif [[ "${old_month}" != "${month}" ]]; then
            changed=false
            message="chore: monthly package check-in (${month}, no changes)"
          else
            echo "No package changes. Nothing to publish."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          { echo "# Checked: ${month}"; echo "${new_body}"; } > package_versions.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package_versions.txt
          git commit -m "${message}"
          git push origin HEAD:dev
          git diff HEAD~1 --stat
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Build, scan, publish
    needs: check
    if: needs.check.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
