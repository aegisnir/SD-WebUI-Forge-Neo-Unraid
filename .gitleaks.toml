title = "gitleaks"

# Per-repo allowlist for patterns that match secret-detection rules
# but are intentional and safe in this project.

[allowlist]
  description = "Known-safe values and files"

  # webui-auth.txt now holds comments only: the first-launch password is random.
  # Older commits still contain the former placeholder login, which was
  # documented publicly and is not a deployed secret, so the path stays listed.
  paths = [
    '''webui-auth.txt''',
  ]
